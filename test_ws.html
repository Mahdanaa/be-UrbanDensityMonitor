<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard CCTV | Urban Density</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
      /* --- (CSS SAMA PERSIS SEPERTI PUNYAMU) --- */
      body { font-family: Arial, sans-serif; background: #1a1a1a; color: #eee; margin: 0; padding: 20px; }
      h1 { font-size: 20px; margin-bottom: 5px; color: #fff; }
      p.note { font-size: 13px; color: #aaa; margin-bottom: 20px; }
      .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

      /* Tambahan CSS untuk Input Token JWT */
      input.token-box { padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #eee; font-size: 14px; min-width: 300px; }
      button.btn-load { background: #3498db; }
      button.btn-load:hover { background: #2980b9; }

      select { padding: 8px 12px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #eee; font-size: 14px; min-width: 260px; }
      button { padding: 8px 18px; border-radius: 6px; border: none; background: #e74c3c; color: white; font-size: 14px; cursor: pointer; }
      button:hover { background: #c0392b; }
      #status { font-size: 13px; padding: 6px 12px; border-radius: 6px; background: #2a2a2a; border: 1px solid #444; }
      .video-box { background: #000; border-radius: 8px; overflow: hidden; max-width: 860px; }
      .video-box video { width: 100%; display: block; max-height: 480px; background: #000; }
      .video-info { padding: 10px 14px; background: #222; font-size: 13px; color: #aaa; }
      .video-info span { color: #eee; font-weight: bold; }
      #log { margin-top: 20px; max-width: 860px; background: #111; border: 1px solid #333; border-radius: 6px; padding: 12px 14px; font-size: 12px; font-family: monospace; max-height: 180px; overflow-y: auto; color: #aaa; }
      .log-ok { color: #2ecc71; }
      .log-err { color: #e74c3c; }
      .log-inf { color: #3498db; }
      h2 { font-size: 15px; margin: 28px 0 10px; color: #ccc; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; max-width: 860px; }
      .card { background: #2a2a2a; border: 1px solid #3a3a3a; border-radius: 6px; padding: 10px 12px; cursor: pointer; transition: background 0.15s; }
      .card:hover { background: #333; }
      .card .name { font-size: 13px; font-weight: bold; color: #eee; margin-bottom: 4px; }
      .card .meta { font-size: 11px; color: #888; }
      .badge { display: inline-block; font-size: 10px; padding: 2px 6px; border-radius: 10px; background: #2ecc71; color: #000; margin-left: 5px; vertical-align: middle; }
    </style>
  </head>
  <body>
    <h1>🎥 Test CCTV PantauSemar (Terkoneksi Database)</h1>
    <p class="note">
      Masukkan Kunci Master (JWT Token) untuk menarik daftar CCTV dari Database Supabase.
    </p>

    <div class="controls" style="background: #222; padding: 15px; border-radius: 8px;">
      <input type="password" id="jwtToken" class="token-box" placeholder="Paste Kunci Master (JWT) di sini..." />
      <button class="btn-load" onclick="fetchStreamsFromDB()">🔄 Tarik Data CCTV</button>
    </div>

    <div class="controls">
      <select id="cctvSelect">
        <option value="">-- Tarik Data Terlebih Dahulu --</option>
      </select>
      <button onclick="loadFromSelect()">▶ Play</button>
      <div id="status">Belum ada stream dipilih</div>
    </div>

    <div class="video-box">
      <img id="videoFeed" style="width: 100%; display: block; max-height: 480px; object-fit: contain; background: #000;" />
      <div class="video-info" id="videoInfo">Pilih CCTV untuk memulai.</div>
    </div>

    <div id="log">[log] Menunggu koneksi ke Database...</div>

    <h2>Daftar CCTV dari Database</h2>
    <div class="grid" id="cctvGrid"></div>

    <script>
      let cctvData = [];
      const select = document.getElementById('cctvSelect');
      const grid = document.getElementById('cctvGrid');
      const logEl = document.getElementById('log');

      // // Kita ganti elemen <video> jadi <img> untuk nangkep gambar dari FastAPI
      // const videoBox = document.querySelector('.video-box');
      // videoBox.innerHTML = '<img id="videoFeed" style="width: 100%; display: block; max-height: 480px; object-fit: contain; background: #000;" />';
      const videoFeed = document.getElementById('videoFeed');

      const statusEl = document.getElementById('status');
      const infoEl = document.getElementById('videoInfo');

      // Variabel buat nyimpan koneksi WebSocket
      let wsConnection = null;

      function log(msg, type = 'inf') {
        const ts = new Date().toLocaleTimeString();
        const line = document.createElement('div');
        line.className = 'log-' + type;
        line.textContent = `[${ts}] ${msg}`;
        logEl.appendChild(line);
        logEl.scrollTop = logEl.scrollHeight;
      }

      // --- 1. Tarik Daftar CCTV ---
      // --- 1. Tarik Daftar CCTV ---
      async function fetchStreamsFromDB() {
        const token = document.getElementById("jwtToken").value.trim();
        if (!token) return alert("Masukkan JWT Token dulu!");

        log("Menarik data CCTV...", "inf");
        try {
          const res = await fetch("http://localhost:8000/api/streams/", {
            headers: { "Authorization": "Bearer " + token }
          });
          const result = await res.json();

          // 🚨 TAMBAHAN BARU: Cek kalau ditolak Satpam!
          if (!res.ok) {
              throw new Error(result.detail || "Server menolak permintaan");
          }

          cctvData = result.data;
          log(`✅ Sukses! ${cctvData.length} CCTV dimuat.`, "ok");
          buildUI();
        } catch (e) {
          // Sekarang dia bakal nampilin alasan aslinya (misal: Tiket Kedaluwarsa)
          log(`❌ Error: ${e.message}`, "err");
        }
      }

      // --- 2. Bikin UI Kotak-kotak ---
      function buildUI() {
        select.innerHTML = '<option value="">-- Pilih CCTV --</option>';
        grid.innerHTML = '';
        cctvData.forEach((cctv, i) => {
          select.options.add(new Option(cctv.location_name, i));

          const card = document.createElement('div');
          card.className = 'card';
          // Kita kasih label 'AI' karena ini udah lewat YOLO
          card.innerHTML = `<div class="name">${cctv.location_name} <span class="badge" style="background:#f39c12">AI</span></div>`;
          card.onclick = () => playCCTV(i);
          grid.appendChild(card);
        });
      }

      function loadFromSelect() {
        if (select.value === '') return;
        playCCTV(parseInt(select.value));
      }

      // --- 3. MAINKAN CCTV (Pindah ke Jalur WebSockets) ---
      function playCCTV(idx) {
        const cctv = cctvData[idx];
        if (!cctv) return;

        log(`Menghubungkan AI ke: ${cctv.location_name}`, 'inf');
        infoEl.innerHTML = `Stream: <span>${cctv.location_name}</span> (ID: ${cctv.id})`;

        // Tutup telepon lama kalau masih nyambung
        if (wsConnection) {
            wsConnection.close();
            videoFeed.src = "";
        }

        // Bikin URL telepon baru ke FastAPI (Perhatikan format ws://)
       const wsUrl = `ws://127.0.0.1:8000/ws/live/${cctv.id}`;
        wsConnection = new WebSocket(wsUrl);

        wsConnection.onopen = () => {
            log(`✅ Tersambung ke AI Koki!`, 'ok');
            statusEl.textContent = "🟢 Tersambung";
            statusEl.style.color = "#2ecc71";
        };

        // Pas data gambar (Base64) dateng dari FastAPI
        wsConnection.onmessage = (event) => {
            const data = JSON.parse(event.data);

            // Tampilkan gambar ber-kotak merah
            videoFeed.src = "data:image/jpeg;base64," + data.frame_base64;

            // Tampilkan info kepadatan
            let text = `Status: ${data.density_status} | Rasio: ${data.person_vehicle_ratio}`;
            if (data.alert) {
                text = `🚨 ${data.alert.message}`;
                statusEl.style.color = "#e74c3c";
            } else {
                statusEl.style.color = "#2ecc71";
            }
            statusEl.textContent = text;
        };

        wsConnection.onerror = (e) => {
            log("❌ Gagal nyambung ke FastAPI!", "err");
            statusEl.textContent = "🔴 Error";
        };

        wsConnection.onclose = () => {
             log("🛑 Stream dihentikan.", "inf");
        };
      }
    </script>
  </body>
</html>
