name: Deploy to Server

on:
  push:
    branches:
      - main # Workflow akan berjalan otomatis setiap ada push ke branch main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }} # Biasanya port 22
          # Sesuaikan PATH_TO_PROJECT dengan direktori project di VPS Anda (contoh: /var/www/urban-density-backend)
          script: |
            cd ${{ secrets.PATH_TO_PROJECT }}/docker
            ./deploy.sh
